# docker‑compose.yml
version: "3"
services:
  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=ВашДомен.ru
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://ВашДомен.ru/
      - GENERIC_TIMEZONE=Europe/Moscow
      - N8N_COOKIE_DOMAIN=.ВашДомен.ru
      - N8N_ENCRYPTION_KEY=сгенерированный_32‑символьный_ключ_без_пробелов
      - N8N_PROXY_HOPS=1        # один hop (nginx) между клиентом и n8n
    volumes:
      - ~/.n8n:/home/node/.n8n