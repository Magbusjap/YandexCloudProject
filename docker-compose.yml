version: "3"
services:
  n8n:
    image: n8nio/n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=51.250.31.91
      - N8N_PORT=5678
      - N8N_PROTOCOL=http    # Для теста (HTTPS можно настроить позже)
      - WEBHOOK_TUNNEL_URL=http://<PUBLIC_IP>
    volumes:
      - ~/.n8n:/home/node/.n8n
